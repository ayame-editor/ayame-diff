site_name: ayame-diff
site_description: A native CLI for comparing huge CSV/TSV and text files, with encoding auto-detection and a local web GUI.
site_url: https://hjosugi.github.io/ayame-diff/
repo_url: https://github.com/hjosugi/ayame-diff
repo_name: hjosugi/ayame-diff
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - en
        - ja

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/ayame-docs.css

extra:
  generator: false
  alternate:
    - name: English
      link: /ayame-diff/
      lang: en
    - name: 日本語
      link: /ayame-diff/ja/
      lang: ja
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hjosugi/ayame-diff

nav:
  - Home: index.md
  - Get started:
      - GUI guide: gui.md
      - File-manager integration: shell-integration.md
  - Compare:
      - CLI usage: usage.md
      - Comparison options: comparison-options.md
      - Encoding: encoding.md
      - Merge and reconcile: merge.md
      - Three-way comparison: three-way.md
  - Automate:
      - Comparison projects: projects.md
      - GUI setup parity: gui-setup-parity.md
      - GUI regression checklist: ui-regression-checklist.md
  - Project:
      - Packaging and Windows trust: packaging.md
      - Ayame family design: design.md
      - Architecture decisions:
          - Overview: adr/README.md
          - "0001: Project name": adr/0001-naming-unification.md
          - "0002: Diff architecture": adr/0002-diff-acceptance-architecture.md
          - "0003: Encoding dependency": adr/0003-encoding-dependency.md
  - 日本語:
      - ホーム: ja/index.md
      - はじめる:
          - GUI ガイド: gui.ja.md
          - ファイルマネージャー統合: shell-integration.ja.md
      - 比較する:
          - CLI の使い方: usage.ja.md
          - 比較オプション: comparison-options.ja.md
          - 文字コード: encoding.ja.md
          - マージと調整: merge.ja.md
          - 3-way 比較: three-way.ja.md
      - 自動化する:
          - 比較プロジェクト: projects.ja.md
          - GUI 設定対応表: gui-setup-parity.ja.md
          - GUI 退行防止チェックリスト: ui-regression-checklist.ja.md
      - プロジェクト:
          - パッケージングと Windows の信頼: packaging.ja.md
          - Ayame ファミリーのデザイン: design.ja.md
          - アーキテクチャ決定記録:
              - 概要: adr/README.ja.md
              - "0001: プロジェクト名": adr/0001-naming-unification.ja.md
              - "0002: diff アーキテクチャ": adr/0002-diff-acceptance-architecture.ja.md
              - "0003: 文字コード依存": adr/0003-encoding-dependency.ja.md
