site_name: ayame-diff
site_description: A native CLI for comparing huge CSV/TSV and text files, with encoding auto-detection and a local web GUI.
site_url: https://hjosugi.github.io/ayame-diff/
repo_url: https://github.com/hjosugi/ayame-diff
repo_name: hjosugi/ayame-diff
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - en
        - ja

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hjosugi/ayame-diff

nav:
  - Home: index.md
  - Usage: usage.md
  - Encoding: encoding.md
  - GUI: gui.md
  - GUI setup parity: gui-setup-parity.md
  - Ayame family design: design.md
  - Comparison projects: projects.md
  - Comparison options: comparison-options.md
  - 日本語:
      - ホーム: ja/index.md
