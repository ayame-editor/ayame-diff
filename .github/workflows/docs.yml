name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - scripts/check-adr-i18n.sh
      - scripts/check-docs-i18n.sh
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-adr-i18n.sh
      - run: ./scripts/check-docs-i18n.sh
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install mkdocs-material==9.6.14
      - run: mkdocs gh-deploy --force --strict
