name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/build-all.sh
      - name: Package release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/package-release.sh
      - name: VirusTotal pre-release scan
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: ./scripts/virustotal-scan.sh "release/ayame-diff-${GITHUB_REF_NAME}-windows.zip"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/*
          --verify-tag
          --generate-notes
          --title "ayame-diff ${GITHUB_REF_NAME}"
