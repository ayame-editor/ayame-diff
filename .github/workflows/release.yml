name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Verify tag is documented in CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq "^## ${GITHUB_REF_NAME} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || {
            echo "CHANGELOG.md must contain an exact release heading for ${GITHUB_REF_NAME}" >&2
            exit 1
          }
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/build-all.sh
      - name: Package release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/package-release.sh
      - name: VirusTotal pre-release scan
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: ./scripts/virustotal-scan.sh "release/ayame-diff-${GITHUB_REF_NAME}-windows.zip"
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: release/*
          if-no-files-found: error

  windows-package-smoke:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: release
      - name: Verify packaged executable and WinGet manifest
        shell: pwsh
        run: >-
          ./scripts/windows-package-smoke.ps1
          -Archive "release/ayame-diff-${{ github.ref_name }}-windows.zip"
          -ManifestArchive "release/ayame-diff-${{ github.ref_name }}-winget-manifests.zip"
          -Version "${{ github.ref_name }}"

  publish:
    needs: windows-package-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/*
          --verify-tag
          --generate-notes
          --title "ayame-diff ${GITHUB_REF_NAME}"
