name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: make smoke

  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: targets
        run: |
          matrix=$(jq -Rsc 'split("\n") | map(select(length > 0 and (startswith("#") | not)) | split(" ") | {goos: .[0], goarch: .[1], ext: (if .[2] == "-" then "" else .[2] end)})' < scripts/targets.txt)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test ./...
      - name: Build native Windows executable
        run: >-
          go build -trimpath
          -ldflags "-s -w -X main.version=$(git describe --tags --always --dirty)"
          -o ayame-diff.exe
          ./cmd/ayame-diff
      - run: .\ayame-diff.exe --version

  build:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: >-
          go build -trimpath
          -ldflags "-s -w -X main.version=$(git describe --tags --always --dirty)"
          -o "ayame-diff-${GOOS}-${GOARCH}${{ matrix.ext }}"
          ./cmd/ayame-diff
      - uses: actions/upload-artifact@v7
        with:
          name: ayame-diff-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ayame-diff-*
          if-no-files-found: error
