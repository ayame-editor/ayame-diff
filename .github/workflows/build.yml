name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_VERSION: v0.0.0-ci.${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test ./...
      - name: Patch compatibility (GNU patch + git apply)
        run: go test ./internal/diffout -run TestPatchFormatsApplyWithGNUAndGit -v
      - run: go test -race ./...
      - run: go vet ./...
      - run: make smoke

  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: targets
        run: |
          matrix=$(jq -Rsc 'split("\n") | map(select(length > 0 and (startswith("#") | not)) | split(" ") | {goos: .[0], goarch: .[1], ext: (if .[2] == "-" then "" else .[2] end)})' < scripts/targets.txt)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test ./...
      - name: Build native Windows executable
        run: >-
          go build -trimpath
          -ldflags "-s -w -X main.version=$(git describe --tags --always --dirty)"
          -o ayame-diff.exe
          ./cmd/ayame-diff
      - run: .\ayame-diff.exe --version

  build:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ env.CANDIDATE_VERSION }}
        run: >-
          go build -trimpath
          -ldflags "-s -w -X main.version=${VERSION}"
          -o "ayame-diff-${GOOS}-${GOARCH}${{ matrix.ext }}"
          ./cmd/ayame-diff
      - uses: actions/upload-artifact@v7
        with:
          name: ayame-diff-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ayame-diff-*
          if-no-files-found: error

  package-candidate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: ayame-diff-*
          path: dist
          merge-multiple: true
      - name: Package the cross-built release candidate
        env:
          VERSION: ${{ env.CANDIDATE_VERSION }}
        run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: windows-package-candidate
          path: |
            release/ayame-diff-${{ env.CANDIDATE_VERSION }}-windows.zip
            release/ayame-diff-${{ env.CANDIDATE_VERSION }}-winget-manifests.zip
          if-no-files-found: error

  windows-package-smoke:
    needs: package-candidate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-package-candidate
          path: release
      - name: Verify packaged executable and WinGet manifest
        shell: pwsh
        run: >-
          ./scripts/windows-package-smoke.ps1
          -Archive "release/ayame-diff-${{ env.CANDIDATE_VERSION }}-windows.zip"
          -ManifestArchive "release/ayame-diff-${{ env.CANDIDATE_VERSION }}-winget-manifests.zip"
          -Version "${{ env.CANDIDATE_VERSION }}"
