name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test ./...
      - name: Build native Windows executable
        run: >-
          go build -trimpath
          -ldflags "-s -w -X main.version=v0.3.1"
          -o fcsv-diff.exe
          ./cmd/fcsv-diff
      - run: .\fcsv-diff.exe --version

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
          - goos: windows
            goarch: arm64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: >-
          go build -trimpath
          -ldflags "-s -w -X main.version=v0.3.1"
          -o "fcsv-diff-${GOOS}-${GOARCH}${{ matrix.ext }}"
          ./cmd/fcsv-diff
      - uses: actions/upload-artifact@v7
        with:
          name: fcsv-diff-${{ matrix.goos }}-${{ matrix.goarch }}
          path: fcsv-diff-*
          if-no-files-found: error
