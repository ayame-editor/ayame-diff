name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Web unit tests
        # node --test needs no dependencies; the web assets are plain scripts
        # with no build step, and this keeps it that way (#139).
        run: node --test internal/server/web/test/*.test.js
      - run: go vet ./...
      - name: staticcheck
        # Pinned so an unrelated PR never breaks when a new staticcheck ships;
        # bump deliberately. v0.7.0 == staticcheck 2026.1.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...
